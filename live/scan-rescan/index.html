<style>
/* One plate, split down the middle: Scan's slicer on black on the left, Rescan's granulator on white on
   the right. Everything they share sits on the seam, half in each world. Each half is its own page in a
   frame, drawn at its real size and scaled to fit; this page owns what the two halves share. */
:root{
  --desk:#1d1d1b;
  --desk-ink:#e3e2db;
  --desk-dim:#a3a29a;
  --black:#121212;
  --white:#ededed;
  --display:"Outfit","Avenir Next","Helvetica Neue",sans-serif;
  --num:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#1d1d1b}}
:root[data-theme="dark"]{--desk:#1d1d1b}
html,body{background:var(--desk);color:var(--desk-ink);margin:0}
body{
  font-family:var(--display);font-weight:300;-webkit-font-smoothing:antialiased;
  padding:44px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));
}
::selection{background:var(--desk-ink);color:var(--desk)}
.wrap{max-width:1880px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:56px}

.desk{position:relative}
.console{
  display:flex;width:max-content;margin:0 auto;border-radius:4px;overflow:hidden;
  /* behind the frames: the same black and white, so no hairline of desk can show through the seam */
  background:linear-gradient(to right,var(--black) 50%,var(--white) 50%);
  box-shadow:0 1px 2px rgba(0,0,0,.55),0 40px 80px -30px rgba(0,0,0,.85);
}
.side{overflow:hidden;flex:none}
.side iframe{display:block;border:0;width:940px;transform-origin:0 0;background:transparent}

.notes{display:grid;gap:20px;max-width:680px;margin:0 auto;width:100%}
.notes h2{margin:0;font-weight:200;font-size:28px;letter-spacing:.01em;text-wrap:balance}
.notes ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.notes li{font-size:17px;line-height:1.5;color:var(--desk-dim);padding-left:24px;position:relative}
/* each bullet is a planet on the seam: half light, half dark */
.notes li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:50%;border:1px solid var(--desk-ink);background:linear-gradient(to right,var(--desk) 50%,var(--desk-ink) 50%)}
.notes li b{font-weight:400;color:var(--desk-ink)}
.notes .keys{font-family:var(--num);font-size:12px;color:var(--desk-dim);margin:0;line-height:2}
kbd{font-family:var(--num);font-size:11px;border:1px solid #4a4a45;border-radius:3px;padding:1px 5px;color:var(--desk-ink)}

/* live page: bar, window, footer */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{padding:0!important;margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;touch-action:manipulation}
.top,.foot{flex:none;display:flex;align-items:center;gap:14px;padding:0 max(14px,env(safe-area-inset-left,0px));background:var(--desk);color:var(--desk-ink)}
.top{height:42px;border-bottom:1px solid #2c2c29}
.foot{min-height:44px;border-top:1px solid #2c2c29;padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));justify-content:space-between}
.brand{font-weight:300;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.ver{font-family:var(--num);font-size:11px;color:var(--desk-dim);margin-left:8px}
.sp{flex:1}
.seg{display:flex;border:1px solid #4a4a45;border-radius:99px;overflow:hidden}
.seg button{font:400 12px/1 var(--display);letter-spacing:.06em;color:var(--desk-dim);background:none;border:0;padding:8px 14px;cursor:pointer;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk)}
.seg button:focus-visible,.x:focus-visible,.get:focus-visible{outline:1px dashed var(--desk-ink);outline-offset:3px}
.x{font:200 26px/1 var(--display);color:var(--desk-ink);background:none;border:0;width:36px;height:36px;margin-right:-6px;cursor:pointer;border-radius:50%}
.x:hover{background:#2c2c29}
.foot p{margin:0;font-size:12px;line-height:1.4;color:var(--desk-dim)}
.get{font:400 12px/1 var(--display);letter-spacing:.06em;color:var(--desk);background:var(--desk-ink);border:1px solid var(--desk-ink);border-radius:99px;padding:9px 16px;text-decoration:none;white-space:nowrap}
.get:hover{background:#fff}
.stage{flex:1 1 0;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.desk{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.console{margin:0!important;flex:none}
@media (max-width:640px){.top{gap:8px;padding:0 10px}.brand{font-size:14px}.ver{margin-left:5px}.seg button{padding:7px 11px}.foot{gap:10px;padding-left:10px;padding-right:10px}.foot p{font-size:11px}.get{padding:8px 12px;font-size:11.5px}}
</style>

<script>
/* ================= what the two suns share ================= */
const BPM = 96;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* ================= live page: talk to the parent, wake the audio ================= */
const LIVE_VERSION = "0.9.2";
const IN_FRAME = window.parent !== window;
const CLIPS = { keys: "dry-keys.mp3", voice: "dry-voice.mp3" };
let liveClip = "keys", liveStarted = false;
const clipBytes = {}, clipBuf = {};
for (const k in CLIPS) clipBytes[k] = fetch(CLIPS[k]).then(r => r.arrayBuffer()).catch(() => null);
function liveEvt(type, name) {
  if (type === "start") { if (liveStarted) return; liveStarted = true; }
  try { window.parent.postMessage({ gushLive: type, name: name === undefined ? null : name }, "*"); } catch (_) {}
}
async function renderDemo() {   // the deck's loader for its source: now the chosen dry loop
  const k = liveClip, c = SHARED.ctx();
  if (!clipBuf[k]) { const ab = await clipBytes[k]; if (!ab) throw new Error("clip missing"); clipBuf[k] = await c.decodeAudioData(ab.slice(0)); }
  return clipBuf[k];
}

window.SHARED = (() => {
  "use strict";
  const decks = {}, each = f => ["scan", "rescan"].forEach(k => decks[k] && f(decks[k]));
  const other = side => decks[side === "scan" ? "rescan" : "scan"];
  let ctx = null, inS, inR, gS, gR, playing = false, src = null, fadeX = .5, batch = false, srcPromise = null;
  const undo = [], sunsOn = { scan: true, rescan: true };
  const clock = { now: () => performance.now() };

  function audio() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)(); window.__ctxMade = true;
    // each sun ends in its own gain; the blend sets the two, a soft limiter keeps the sum in place
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -4; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = .003; lim.release.value = .2;
    inS = ctx.createGain(); inR = ctx.createGain(); gS = ctx.createGain(); gR = ctx.createGain();
    inS.connect(gS); inR.connect(gR); gS.connect(lim); gR.connect(lim); lim.connect(ctx.destination);
    applyFade(true);
    return ctx;
  }
  /* the blend: both suns at full in the middle; each side fades out only past the middle */
  function applyFade(now) {
    if (!ctx) return;
    let a = fadeX <= .5 ? 1 : Math.cos((fadeX - .5) * Math.PI), b = fadeX >= .5 ? 1 : Math.cos((.5 - fadeX) * Math.PI);
    // a sun switched off is silent, and the other one plays at full whatever the blend says
    if (!sunsOn.scan) { a = 0; b = sunsOn.rescan ? 1 : 0; }
    if (!sunsOn.rescan) { b = 0; a = sunsOn.scan ? 1 : 0; }
    const t = ctx.currentTime;
    if (now) { gS.gain.value = a * .8; gR.gain.value = b * .8; }
    else { gS.gain.setTargetAtTime(a * .8, t, .02); gR.gain.setTargetAtTime(b * .8, t, .02); }
  }
  function reversed(b) {
    const r = audio().createBuffer(b.numberOfChannels, b.length, b.sampleRate);
    for (let c = 0; c < b.numberOfChannels; c++) { const s = b.getChannelData(c), d = r.getChannelData(c); for (let i = 0, n = s.length; i < n; i++) d[i] = s[n - 1 - i]; }
    return r;
  }
  function source() {
    if (src) return Promise.resolve(src);
    if (!srcPromise) srcPromise = renderDemo().then(b => (src = { buf: b, rev: reversed(b) }));
    return srcPromise;
  }
  async function play() {
    each(d => d.setLoading(true));

  /* the undo history. Each entry remembers only what it changed, in parts: "scan", "rescan" (a side's

     latest part of its own, wherever it sits in the history; undo last takes back the latest entry whole. */

    const s = Math.min(1.5, deskEl.clientWidth / (2 * PW), deskEl.clientHeight / h);
    for (const f of frames) {
      f.style.height = h + "px"; f.style.transform = `scale(${s})`;

    clock, ctx: audio, input: side => side === "scan" ? inS : inR,

    presetHover(i) { if (pHl !== i) { pHl = i; syncPreset(); } },
    // saving asks for a name first, typed right where the preset's name is shown
    presetSave() { pName = ""; pOpen = false; pHl = -1; syncPreset(); each(d => d.say("Name this sound, then press Return. Escape lets it go.")); },
    presetType(t) { if (pName !== null) { pName = t.slice(0, 40); syncPreset(); } },
    presetCancel() { if (pName === null) return; pName = null; syncPreset(); },
    presetCommit() {
      const name = (pName || "").trim(); pName = null;
      if (!name) { syncPreset(); return; }
      const old = presets.findIndex(p => p.user && p.name === name);
      if (old >= 0) presets.splice(old, 1);
      presets.push({ name, desc: "Your own preset.", state: capture(), user: true }); ++userN;
      pCur = presets.length - 1; pDirty = false; pOpen = false; pHl = -1; syncPreset();
      each(d => d.say(`Saved as ${presets[pCur].name}.`));
    }
  };
})();

ustify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 36px 0}\n.mark{font-weight:200;font-size:30px;line-height:1;letter-spacing:.06em;text-transform:lowercase}\n.host{font-family:var(--num);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center}\n.host .live{display:inline-flex;align-items:center;gap:6px}\n.host .live::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:beat .625s var(--ease) infinite}\n@keyframes beat{0%{transform:scale(1.5);opacity:1}60%,100%{transform:scale(1);opacity:.55}}\n.src{display:flex;gap:8px}\n.pill{\n  font:inherit;font-family:var(--caps);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);\n  background:none;border:1px solid var(--ink-faint);border-radius:999px;\n  padding:5px 14px 6px;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n  transition:color .4s var(--ease),border-color .4s var(--ease),background-color .4s var(--ease);\n}\n.pill:hover{color:var(--ink);border-color:var(--ink-soft)}\n.pill.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}\n:is(.pill,.cnt,.act,.knob):focus-visible{outline:1px dashed var(--ink);outline-offset:4px;border-radius:999px}\n\ncanvas#stage{display:block;width:100%;height:auto;aspect-ratio:880/540;touch-action:none}\n\n/* ---------- deck ---------- */\n.deck{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;padding:6px 36px 26px}\n.cap{font-family:var(--caps);font-size:10.5px;font-weight:500;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.14em;line-height:1}\n.shape{display:grid;gap:14px}\n.counts{display:grid;grid-template-columns:auto auto;align-items:center;gap:14px;justify-content:start}\n.counts .cap{padding-bottom:16px}\n.counts .row{display:flex;gap:2px}\n.cnt{\n  background:none;border:0;padding:4px 3px 0;cursor:pointer;display:grid;justify-items:center;gap:6px;\n  font-family:var(--num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;\n  transition:color .4s var(--ease);\n}\n.cnt svg{display:block;transition:transform .6s var(--ease)}\n.cnt:hover svg{transform:rotate(22deg)}\n.cnt[aria-checked=\"true\"]{color:var(--ink)}\n.rule{width:1px;align-self:stretch;background:var(--ink-faint);margin-block:6px 2px}\n\n.layer{display:grid;gap:12px;min-width:0}\n.layer-head{display:flex;align-items:baseline;gap:12px;min-height:26px;flex-wrap:wrap}\n.layer-name{font-size:22px;font-weight:300;line-height:1;letter-spacing:.01em}\n.layer-desc{font-size:13px;font-weight:300;color:var(--ink-soft);line-height:1.2}\n.knobs{display:flex;gap:22px;transition:opacity .22s ease,transform .3s var(--ease),filter .3s ease}\n.knobs.out{opacity:0;transform:translateY(6px);filter:blur(3px)}\n.knobs .k{display:grid;justify-items:center;gap:2px;transition:opacity .5s var(--ease),transform .6s var(--ease)}\n.knobs.in .k{opacity:0;transform:translateY(8px)}\n.knob{display:block;cursor:ns-resize;touch-action:none;border-radius:50%}\n.k .val{font-family:var(--num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;height:14px;line-height:14px;transition:color .3s}\n.k.active .val{color:var(--ink)}\n\n.spacer{flex:1 1 0}\n.actions{display:flex;gap:18px}\n.act{background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;gap:8px;color:var(--ink)}\n.act svg{display:block;overflow:visible}\n.act .cap{transition:color .3s}\n.act:hover .cap{color:var(--ink)}\n.act[disabled]{opacity:.3;cursor:default}\n\n\n.help{\n  margin:0;padding:14px 36px 18px;border-top:1px solid var(--ink-faint);\n  font-size:14px;font-weight:300;color:var(--ink-soft);min-height:20px;line-height:1.45;\n}\n\n/* ---------- notes ---------- */\n.notes{display:grid;gap:20px;max-width:640px}\n.notes h2{margin:0;font-weight:200;font-size:28px;letter-spacing:.01em;color:var(--desk-ink);text-wrap:balance}\n.notes ul{margin:0;padding:0  the eclipse switches, Gush's on/off mark: beside each sun's name, and beside the open planet's name on the seam */\n.sw{appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;color:inherit;display:block;border-radius:50%;flex:none}\n.sw canvas{display:block;width:100%;height:100%}\n.sw:focus-visible{outline:1px dashed var(--ink);outline-offset:-4px}\n.sun-sw{width:52px;height:52px;margin:-18px 0 -18px -22px}\n.seam-title{position:relative;display:block}\n.fx-sw{position:absolute;right:100%;top:50%;width:48px;height:48px;margin:-25px 0 0 0}\n.fx-sw[hidden]{display:none}\n.seam-name.off{color:var(--ink-soft)}\n.f-cap{transition:opacity .5s var(--ease)}\n.f-cap.dark{opacity:.3}\n.seam-desc{font-size:13px;font-weight:300;color:var(--ink-soft);line-height:1.2}\n.seam-row{display:flex;align-items:flex-start;justify-content:center;width:100%}\n.seam-knobs{width:256px;justify-content:center;gap:14px;min-height:108px;align-items:flex-start}\n.seam-hint{margin:0;align-self:center;max-width:200px;font-size:12.5px;line-height:1.55;color:var(--ink-soft);text-align:center;text-wrap:balance}\n\n/* the blend fader: Scan on the left, Rescan on the right, both at full in the middle */\n.master{position:absolute;right:-290px;bottom:0;width:580px;height:58px}\n.master .pill{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;padding:5px 13px 6px}\n.m-roll{left:0}\n.m-undo{right:0}\n.master .pill[disabled]{opacity:.35;cursor:default;pointer-events:none}\n.fader{position:absolute;left:120px;bottom:0;width:340px;height:58px;touch-action:none;cursor:ew-resize;--x:.5;border-radius:2px}\n.fader:focus-visible{outline:1px dashed var(--ink);outline-offset:-6px}\n.f-track{position:absolute;left:70px;width:200px;top:19px;height:20px}\n.f-track::before{content:\"\";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink-faint)}\n.f-track::after{content:\"\";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--ink-soft);transform:translateX(-.5px)}\n.f-knob{position:absolute;top:50%;left:calc(var(--x) * 100%);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--ink);transition:transform .3s var(--ease)}\n.fader:hover .f-knob,.fader.active .f-knob{transform:scale(1.18)}\n.f-cap{position:absolute;top:24px;font-family:var(--caps);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);line-height:1}\n.f-cap.l{right:284px}\n.f-cap.r{left:284px}\n\n/* the preset menu: its name sits on the seam, previous on the black side, next on the white */\n.preset{position:absolute;right:-125px;top:18px;width:250px;height:44px;z-index:4}\n.p-step{position:absolute;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink-faint);background:none;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;padding:0;transition:color .3s var(--ease),border-color .3s var(--ease)}\n.p-step:hover{color:var(--ink);border-color:var(--ink-soft)}\n.p-step svg{display:block}\n#presetPrev{left:0}\n#presetNext{right:0}\n.p-save{right:-38px}\n.preset:focus{outline:none}\n.p-input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}\n.preset.naming .p-label{background-image:linear-gradient(var(--ink),var(--ink))}\n.p-label .ph{opacity:.45;font-style:italic}\n.p-label .caret{display:inline-block;width:1px;height:.95em;margin-left:2px;vertical-align:-.1em;background:var(--ink);animation:caret 1s steps(1) infinite}\n@keyframes caret{50%{opacity:0}}\n.p-name{position:absolute;left:40px;right:40px;top:0;height:44px;background:none;border:0;cursor:pointer;color:var(--ink);font:300 18px/1 var(--display);letter-spacing:.01em;display:grid;place-items:center;padding:0}\n.p-name .p-label{position:relative;padding-bottom:5px;background:linear-gradient(var(--ink-faint),var(--ink-faint)) 0 100%/100% 1px no-repeat;transition:background-size .4s var(--ease)}\n.p-name:hover .p-label,.p-name[aria-expanded=\"true\"] .p-label{background-image:linear-gradient(var(--ink-soft),var(--ink-soft))}\n.preset.dirty .p-label::after{content:\"\";position:absolute;right:-12px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--ink-soft)}\n.p-list{position:absolute;top:50px;left:-25px;width:300px;background:#ededed;border:1px solid rgba(18,18,18,.16);border-radius:3px;padding:8px 0;box-shadow:0 22px 44px -18px rgba(0,0,0,.55);display:grid}\n.p-list[hidden]{display:none}\n.p-row{position:relative;height:34px;border:0;cursor:pointer;font:300 15px/1 var(--display);letter-spacing:.01em;padding:0;color:rgba(18,18,18,.66);background:none;transition:color .2s}\n.p-row.hl{color:#121212;background:rgba(18,18,18,.06)}\n.p-row.cur{color:#121212;font-weight:500}\n.p-row.cur::before{content:\"\";position:absolute;left:22px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:1px solid #121212;background:linear-gradient(90deg,#121212 50%,#ededed 50%)}\n.p-row.save{font-family:var(--caps);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}\n.p-rule{height:1px;background:rgba(18,18,18,.14);margin:6px 24px}\n:root{--hl:rgba(237,237,237,.06)}\nhtml,body{overflow:hidden}\n\n.hide-src #srcDemo,.hide-src #srcFile{display:none}\n.about{position:absolute;top:40px;right:0;width:270px;background:var(--paper);border:1px solid var(--ink-faint);border-radius:3px;padding:18px 20px 16px;\n  box-shadow:0 22px 44px -18px rgba(0,0,0,.35);display:grid;gap:10px;z-index:6;text-align:left;cursor:default}\n.about[hidden]{display:none}\n.a-name{font:300 18px/1.1 var(--display);letter-spacing:.01em;color:var(--ink);margin:0}\n.a-ver{font-family:var(--num);font-size:11px;color:var(--ink-soft);margin-left:6px;letter-spacing:0}\n.a-line{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}\n.a-line a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-faint);text-underline-offset:3px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n\n<main class=\"wrap hide-src\">\n  <section class=\"plate\" id=\"plate\" aria-label=\"Scan plugin mockup\">\n    <header class=\"bar\">\n      <div class=\"mark\">scan<\/div>\n      <button class=\"sw sun-sw\" id=\"sunSw\" type=\"button\" role=\"switch\" aria-checked=\"true\" aria-label=\"Scan on\"><canvas id=\"sunSwCv\" aria-hidden=\"true\"><\/canvas><\/button>\n      <div class=\"host\" data-help=\"Tempo, key and meter come from Ableton. Both suns follow the host, and Pitch stays in the key.\">\n        <span>96 bpm<\/span><span>C minor<\/span><span>4/4<\/span><span class=\"live\">synced<\/span>\n      <\/div>\n      <div class=\"src\" hidden>\n        <button class=\"pill on\" id=\"srcDemo\" type=\"button\" data-help=\"A two-bar piano loop in C minor at 96 bpm: four chords broken into eighths, so every slice and every effect is easy to hear.\">piano loop<\/button>\n        <button class=\"pill\" id=\"srcFile\" type=\"button\" data-help=\"Pick any audio file, or drop one on the plate. Both suns play it.\">your audio<\/button>\n        <input type=\"file\" id=\"fileIn\" accept=\"audio/*\" hidden>\n      <\/div>\n    <\/header>\n\n    <canvas id=\"stage\" aria-label=\"The sun. Each bundle of rays is a step; planets on the left are effect layers.\"><\/canvas>\n\n    <footer class=\"deck\">\n      <div class=\"actions\">\n        <button class=\"act\" id=\"dice\" type=\"button\" aria-label=\"Roll the dice for Scan\">\n          <canvas id=\"dieCv\" width=\"64\" height=\"64\" style=\"width:64px;height:64px;display:block\" aria-hidden=\"true\"><\/canvas>\n          <span class=\"cap\">dice<\/span>\n        <\/button>\n        <button class=\"act\" id=\"undo\" type=\"button\" disabled aria-label=\"Undo on Scan\" data-help=\"Undo the last change on Scan only. Undo last, at the bottom, steps back through everything.\">\n          <canvas id=\"glassCv\" width=\"64\" height=\"64\" style=\"width:64px;height:64px;display:block\" aria-hidden=\"true\"><\/canvas>\n          <span class=\"cap\">undo<\/span>\n        <\/button>\n      <\/div>\n      <div class=\"shape\">\n      <div class=\"counts\" data-help=\"Steps per bar. One step is the whole bar; thirty-two steps are very short slices.\">\n        <div class=\"row\" role=\"radiogroup\" aria-label=\"Steps per bar\" id=\"counts\"><\/div>\n        <span class=\"cap\">steps<\/span>\n      <\/div>\n      <div class=\"counts\" data-help=\"Pattern length, from a quarter of a bar to two bars. The sun always shows the whole pattern.\">\n        <div class=\"row\" role=\"radiogroup\" aria-label=\"Pattern length\" id=\"bars\"><\/div>\n        <span class=\"cap\">bars<\/span>\n      <\/div>\n      <\/div>\n      <div class=\"rule\" aria-hidden=\"true\"><\/div>\n      <div class=\"layer\">\n        <div class=\"layer-head\"><span class=\"layer-name\" id=\"layerName\">Gate<\/span><span class=\"layer-desc\" id=\"layerDesc\">which steps play, and how long<\/span><\/div>\n        <div class=\"knobs\" id=\"knobs\"><\/div>\n      <\/div>\n          <\/footer>\n    <p class=\"help\" id=\"help\" aria-live=\"polite\"><\/p>\n    <div class=\"preset\" id=\"preset\" tabindex=\"-1\">\n      <button class=\"p-step\" id=\"presetPrev\" type=\"button\" aria-label=\"Previous preset\" data-help=\"Previous preset.\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M6.5 1.5 3 5l3.5 3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <button class=\"p-name\" id=\"presetName\" type=\"button\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-controls=\"presetList\"><span class=\"p-label\" id=\"presetLabel\">First Light<\/span><\/button>\n      <button class=\"p-step\" id=\"presetNext\" type=\"button\" aria-label=\"Next preset\" data-help=\"Next preset.\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M3.5 1.5 7 5 3.5 8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <button class=\"p-step p-save\" id=\"presetSave\" type=\"button\" aria-label=\"Save as a new preset\" data-help=\"Save as a new preset: name it, press Return.\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6 1.5v6M3.2 5 6 7.8 8.8 5M2 10.5h8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <input class=\"p-input\" id=\"presetInput\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Name for the new preset\" tabindex=\"-1\">\n      <div class=\"p-list\" id=\"presetList\" role=\"listbox\" aria-label=\"Presets\" hidden><\/div>\n    <\/div>\n    <div class=\"seam\" id=\"seam\" aria-label=\"The planets' knobs, shared by both suns\">\n      <div class=\"seam-head\" id=\"fxHead\"><span class=\"seam-title\"><button class=\"sw fx-sw\" id=\"fxSw\" type=\"button\" role=\"switch\" aria-checked=\"true\" hidden><canvas id=\"fxSwCv\" aria-hidden=\"true\"><\/canvas><\/button><span class=\"seam-name\" id=\"fxName\">Planets<\/span><\/span><span class=\"seam-desc\" id=\"fxDesc\">six effects, shared by both suns<\/span><\/div>\n      <div class=\"seam-row\"><div class=\"knobs seam-knobs\" id=\"fxKnobs\"><\/div><\/div>\n    <\/div>\n    <div class=\"master\" id=\"master\">\n    <button class=\"pill m-roll\" id=\"rollBoth\" type=\"button\" data-help=\"Roll both suns at once: new patterns and effects on Scan and Rescan together.\">roll both<\/button>\n    <button class=\"pill m-undo\" id=\"undoLast\" type=\"button\" disabled data-help=\"Undo the last change anywhere: either sun, the planets, a preset. Key Z.\">undo last<\/button>\n    <div class=\"fader\" id=\"fader\" role=\"slider\" tabindex=\"0\" aria-label=\"Blend between Scan and Rescan\" aria-valuemin=\"0\" aria-valuemax=\"100\"\n      data-help=\"Blend. All the way left plays only Scan, all the way right only Rescan; in the middle both play at full. Double-click to centre.\">\n      <span class=\"f-cap l\">scan<\/span><span class=\"f-track\"><span class=\"f-knob\"><\/span><\/span><span class=\"f-cap r\">rescan<\/span>\n    <\/div>\n    <\/div>\n\n  <\/section>\n\n<\/main>\n\n<script>\n(() => {\n\"use strict\";\n/* the outer page owns what the two suns share; on its own this page still plays by itself */\nconst SH = (() => { try { return window.parent !== window && window.parent.SHARED ? window.parent.SHARED : null; } catch (_) { return null; } })();\nconst SIDE = \"scan\";\nconst performance = SH ? SH.clock : window.performance; // one clock for both halves, so a planet's two halves turn together\n\n/* ================= constants ================= */\nconst W = 880, H = 540;\nconst CX = 440, CY = 270, SUN = 80;\nconst STUB = 18, MAXL = 136, R0 = SUN + 6;\nconst BPM = 96, BAR = 60 / BPM * 4;\nconst COUNTS = [1, 2, 4, 8, 16, 32];\nconst BARS = [.25, .5, 1, 2];\nconst BAR_LABEL = { .25: \"1/4\", .5: \"1/2\", 1: \"1\", 2: \"2\" };\nconst FXN = [\"repeat\", \"reverse\", \"freeze\", \"pitch\", \"echo\", \"shimmer\"];\nconst INK = \"237,237,237\"; // pencil-light: the drawing is light on black\nconst PAPER = \"#121212\", PAPER_LIGHT = \"#1b1b1b\";\nconst ink = a => `rgba(${INK},${a})`;\nconst TAU = Math.PI * 2;\n\nconst FX = {\n  repeat:  { name: \"Repeat\",  desc: \"the step stutters in time\" },\n  reverse: { name: \"Reverse\", desc: \"the step plays backwards, swelling in\" },\n  freeze:  { name: \"Freeze\",  desc: \"the step holds the sound it caught first\" },\n  pitch:   { name: \"Pitch\",   desc: \"the step jumps to a new note in the key\" },\n  echo:    { name: \"Echo\",    desc: \"the step echoes in time, through a filter\" },\n  shimmer: { name: \"Shimmer\", desc: \"the step melts into a rising reverb\" }\n};\n/* the planets zigzag down the seam (880 is this page's inner edge), three on Scan's black, three on\n   Rescan's white, with the single plugin's angle and size ratios. Both pages hold all six: a planet on\n   the far side is simply off this canvas, and anything that crosses the seam is drawn by both halves. */\nconst TRAY = [\n  { fx: \"repeat\",  x: 880 - 36, y: 66,  r: 26 },\n  { fx: \"reverse\", x: 880 + 36, y: 146, r: 20 },\n  { fx: \"freeze\",  x: 880 - 36, y: 228, r: 24 },\n  { fx: \"pitch\",   x: 880 + 36, y: 308, r: 19 },\n  { fx: \"echo\",    x: 880 - 36, y: 388, r: 21 },\n  { fx: \"shimmer\", x: 880 + 36, y: 468, r: 29 }\n];\nconst SEAM_NAME = \"Planets\", SEAM_DESC = \"six effects, shared by both suns\";\nconst SEAM_HINT = \"Open a planet, then paint it onto the steps of either sun.\";\nconst DEFAULT_HELP = \"Touch either sun to play both. Click or sweep the rays to switch steps; drag along a ray to set length.\";\n\n/* knob definitions: values are 0..1; stepped knobs snap to their options */\nconst KNOBS = {\n  gate: [\n    { key: \"swing\",  label: \"swing\",  def: .18, fmt: v => `${Math.round(v * 100)}%`, help: \"Swing pushes every second step late, for a looser groove.\" },\n    { key: \"smooth\", label: \"smooth\", def: .4,  fmt: v => `${Math.round(3 + v * 22)} ms`, help: \"Smooth is the fade at both edges of every slice. Low is sharp, high is soft. It never clicks.\" },\n    { key: \"mix\",    label: \"mix\",    def: 1,   fmt: v => `${Math.round(v * 100)}%`, help: \"Mix sets how much of the sliced sound you hear against the original.\" }\n  ],\n  repeat: [\n    { key: \"repeat.hits\", label: \"hits\", def: .25, steps: [\"2\", \"3\", \"4\", \"6\", \"8\"], help: \"How many times each step stutters. Very short steps get fewer hits, so a roll never turns into a buzz.\" },\n    { key: \"repeat.fall\", label: \"fall\", def: .3, fmt: v => `${Math.round(v * 100)}%`, help: \"How much quieter each repeat gets.\" }\n  ],\n  reverse: [\n    { key: \"reverse.tail\",  label: \"tail\",  def: .4, fmt: v => `\u00d7${(1 + v * 1.5).toFixed(1)}`, help: \"How far the reversed sound reaches past its step.\" },\n    { key: \"reverse.swell\", label: \"swell\", def: .6, fmt: v => `${Math.round(v * 100)}%`, help: \"How slowly the reversed sound rises in.\" }\n  ],\n  freeze: [\n    { key: \"freeze.hold\",  label: \"hold\",  def: .8, fmt: v => `${Math.round(v * 100)}%`, help: \"How loud a frozen step stays. It keeps the sound it caught first and plays it every time it comes round.\" },\n    { key: \"freeze.bloom\", label: \"bloom\", def: .5, fmt: v => `\u00d7${(1 + v * 3).toFixed(1)}`, help: \"Frozen sound grows longer and softer, into a pad.\" }\n  ],\n  pitch: [\n    { key: \"pitch.interval\", label: \"interval\", def: .75, steps: [\"\u2212oct\", \"\u22125th\", \"+5th\", \"+oct\", \"+oct 5th\"], help: \"The jump. Only fifths and octaves, so it always fits the key.\" },\n    { key: \"pitch.glide\",    label: \"glide\",    def: 0, fmt: v => v < .01 ? \"jump\" : `${Math.round(v * 100)}%`, help: \"Glide slides into the new note instead of jumping.\" },\n    { key: \"pitch.scatter\",  label: \"scatter\",  def: .2, fmt: v => `${Math.round(v * 100)}%`, help: \"How often a hit picks another note of the key instead, like a slow melody.\" }\n  ],\n  echo: [\n    { key: \"echo.time\", label: \"time\", def: .25, steps: [\"1/8\", \"3/16\", \"1/4\", \"3/8\", \"1/2\"], help: \"Echo time, locked to the tempo.\" },\n    { key: \"echo.feedback\", label: \"feedback\", def: .5, fmt: v => `${Math.round(v * 100)}%`, help: \"How many times the echo comes back.\" },\n    { key: \"echo.filter\", label: \"filter\", def: .45, fmt: v => fmtHz(echoCut(v)), help: \"The echo's filter. Low is dark and far away; high is bright and close.\" }\n  ],\n  shimmer: [\n    { key: \"shimmer.size\", label: \"size\", def: .6, fmt: v => `${shimmerSecs(v).toFixed(1)} s`, help: \"How long the reverb lasts.\" },\n    { key: \"shimmer.rise\", label: \"rise\", def: .5, fmt: v => `${Math.round(v * 100)}%`, help: \"How much of the reverb rises an octave, the shimmer.\" }\n  ]\n};\n/* knob scales, shared by the readouts and the engines */\nconst glowSecs = v => .3 * Math.pow(16 / .3, v);\nconst grainSize = v => .03 * Math.pow(800 / 30, v);\nconst echoCut = v => 300 * Math.pow(9000 / 300, v);\nconst fmtHz = f => f >= 1000 ? `${(f / 1000).toFixed(1)} kHz` : `${Math.round(f)} Hz`;\nconst shimmerSecs = v => 2 + v * 10;\n\n/* ================= state ================= */\nconst P = { swing: .18, smooth: .4, mix: 1,\n  bypass: 0, \"repeat.bypass\": 0, \"reverse.bypass\": 0, \"freeze.bypass\": 0, \"pitch.bypass\": 0, \"echo.bypass\": 0, \"shimmer.bypass\": 0,\n  \"repeat.hits\": .25, \"repeat.fall\": .3, \"reverse.tail\": .4, \"reverse.swell\": .6, \"freeze.hold\": .8, \"freeze.bloom\": .5,\n  \"pitch.interval\": .75, \"pitch.glide\": 0, \"pitch.scatter\": .2, \"echo.time\": .25, \"echo.feedback\": .5, \"echo.filter\": .45,\n  \"shimmer.size\": .6, \"shimmer.rise\": .5 };\nlet spb = 16, bars = 1, count = 16, layer = \"gate\"; // steps per bar, pattern length in bars, total steps on the sun\nconst LOOP = () => BAR * bars;\nconst totalSteps = (s, b) => Math.max(1, Math.round(s * b));\nconst key = (s, b) => `${s}|${b}`;\nconst pats = {};\nfunction emptyPat(c) { const fx = {}; FXN.forEach(f => fx[f] = Array(c).fill(false)); return { steps: Array.from({ length: c }, () => ({ on: false, gate: .5 })), fx }; }\nfunction seedPat(c, list, fx) { const p = emptyPat(c); list.forEach(([i, g]) => p.steps[i] = { on: true, gate: g }); Object.entries(fx || {}).forEach(([f, ids]) => ids.forEach(i => p.fx[f][i] = true)); return p; }\npats[\"1|1\"]  = seedPat(1,  [[0, .75]]);\npats[\"2|1\"]  = seedPat(2,  [[0, 1], [1, .5]], { reverse: [1] });\npats[\"4|1\"]  = seedPat(4,  [[0, 1], [1, .5], [2, .75], [3, .375]], { shimmer: [3] });\npats[\"8|1\"]  = seedPat(8,  [[0, .75], [1, .375], [3, .5], [4, 1], [6, .5], [7, .25]], { echo: [3], reverse: [6] });\npats[\"16|1\"] = seedPat(16, [[0, 1], [2, .5], [3, .25], [6, .75], [8, 1], [10, .5], [11, .25], [13, .5], [14, .75]], { repeat: [3], pitch: [6], reverse: [11], echo: [14] });\n// every other shape is made the first time it opens (see shapePattern)\nconst pat = () => pats[key(spb, bars)];\nconst stepName = i => bars > 1 ? `Bar ${Math.floor(i / spb) + 1}, step ${i % spb + 1}` : `Step ${i + 1}`;\n\nconst undoStack = [];\n// with the other sun linked, a side remembers only its own knobs: the planets' knobs are shared and remembered once\nconst gateP = () => Object.fromEntries(Object.entries(P).filter(([k]) => !k.includes(\".\")));\nconst snap = () => JSON.stringify({ pats, P: SH ? gateP() : P, spb, bars });\nfunction pushUndo(scope) { if (SH) return SH.pushUndo(SIDE, scope); undoStack.push(snap()); if (undoStack.length > 80) undoStack.shift(); syncUndo(); }\nfunction popIfSame() { if (SH) return SH.popIfSame(); if (undoStack.length && undoStack[undoStack.length - 1] === snap()) { undoStack.pop(); syncUndo(); } }\n\n/* ================= helpers ================= */\nfunction mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst rnd = mulberry(11);\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst stepAngle = i => -Math.PI / 2 + i * TAU / count;\nconst mtof = m => 440 * Math.pow(2, (m - 69) / 12);\nfunction findDef(key) { for (const l in KNOBS) for (const d of KNOBS[l]) if (d.key === key) return d; return null; }\nconst stepIndex = key => { const d = findDef(key); return Math.round(P[key] * (d.steps.length - 1)); };\nconst helpEl = document.getElementById(\"help\");\nlet helpLock = 0;\nfunction say(t, hold) { if (!hold && performance.now() < helpLock) return; helpEl.textContent = t; if (hold) helpLock = performance.now() + 1800; }\nconst easeOut = t => 1 - Math.pow(1 - t, 3);\n\n/* ================= paper grain ================= */\n(function grain() {\n  const c = document.createElement(\"canvas\"); c.width = c.height = 220;\n  const g = c.getContext(\"2d\"); const img = g.createImageData(220, 220); const r = mulberry(3);\n  for (let p = 0; p < img.data.length; p += 4) {\n    const dark = r() < .5;\n    img.data[p] = img.data[p + 1] = img.data[p + 2] = dark ? 0 : 225;\n    img.data[p + 3] = Math.floor((dark ? .045 : .05) * 255 * r() * 2);\n  }\n  g.putImageData(img, 0, 0);\n  document.getElementById(\"plate\").style.setProperty(\"--grain\", `url(${c.toDataURL()})`);\n  const st = document.createElement(\"canvas\"); st.width = st.height = 420;\n  const sg = st.getContext(\"2d\"), sr = mulberry(9);\n  for (let k = 0; k < 160; k++) { const big = sr() < .06; sg.fillStyle = `rgba(237,237,237,${big ? .8 : .2 + sr() * .4})`; sg.beginPath(); sg.arc(sr() * 420, sr() * 420, big ? .9 + sr() * .6 : .3 + sr() * .45, 0, Math.PI * 2); sg.fill(); }\n  document.getElementById(\"plate\").style.setProperty(\"--stars\", `url(${st.toDataURL()})`);\n})();\n\n/* ================= planet drawing ================= */\nconst hatch = {};\nFXN.forEach((fx, n) => {\n  const r = mulberry(40 + n * 13), lines = [], dots = [];\n  const set = (ang, gap, jit) => { for (let o = -1; o <= 1; o += gap) { const ca = Math.cos(ang), sa = Math.sin(ang), off = o + (r() - .5) * jit; lines.push([-ca * 1.2 - sa * off, -sa * 1.2 + ca * off, ca * 1.2 - sa * off, sa * 1.2 + ca * off, .5 + r() * .5]); } };\n  if (fx === \"repeat\") set(.35, .17, .04);\n  if (fx === \"reverse\") { set(.6, .2, .05); set(-.75, .2, .05); }\n  if (fx === \"pitch\") for (let k = 0; k < 90; k++) { const a = r() * TAU, d = Math.sqrt(r()) * .95; dots.push([Math.cos(a) * d, Math.sin(a) * d, .03 + r() * .045]); }\n  if (fx === \"shimmer\") { set(.25, .1, .03); set(-.9, .11, .03); set(1.4, .13, .03); }\n  if (fx === \"freeze\") for (let o = .06; o <= 1.05; o += .085) lines.push([-o + (r() - .5) * .02, -1.2, -o + (r() - .5) * .02, 1.2, .55 + r() * .45]);\n  hatch[fx] = { lines, dots };\n});\n/* Planets are lit by the sun: the engraving thins out on the side facing it and the night side is hatched.\n   Large planets (the tray) also turn, each in a way that matches its effect. */\nconst globes = {};\nFXN.forEach((fx, n) => { const r = mulberry(70 + n * 7), blur = fx === \"shimmer\"; globes[fx] = Array.from({ length: blur ? 650 : 150 }, () => [r() * TAU, Math.asin(r() * 2 - 1), blur ? .022 + r() * .034 : .035 + r() * .05]); });\nfunction flatSurface(g, x, y, r, fx) {\n  const h = hatch[fx];\n  for (const L of h.lines) { g.lineWidth = L[4] * Math.max(.6, r / 18); g.beginPath(); g.moveTo(x + L[0] * r, y + L[1] * r); g.lineTo(x + L[2] * r, y + L[3] * r); g.stroke(); }\n  for (const d of h.dots) { g.beginPath(); g.arc(x + d[0] * r, y + d[1] * r, Math.max(.45, d[2] * r), 0, TAU); g.fill(); }\n  if (fx === \"echo\") {\n    g.lineWidth = Math.max(.6, r / 22);\n    for (let k = 1; k <= 4; k++) { g.beginPath(); g.arc(x - r * .12, y + r * .08, r * k * .22, 0, TAU); g.stroke(); }\n  }\n}\nfunction turningSurface(g, x, y, r, fx, ph, lx = 1, ly = 0) {\n  const lw = Math.max(.6, r / 15), tilt = .35, ct = Math.cos(tilt), st = Math.sin(tilt);\n  const meridians = (n, dir) => {\n    for (let k = 0; k < n; k++) {\n      const lon = k * TAU / n + ph * dir, c = Math.cos(lon), u = Math.sin(lon);\n      if (c <= 0) continue;\n      g.lineWidth = lw * (.35 + .65 * c);\n      g.beginPath(); g.ellipse(x, y, Math.max(.01, Math.abs(u) * r), r, tilt, -Math.PI / 2, Math.PI / 2, u < 0); g.stroke();\n    }\n  };\n  if (fx === \"repeat\") meridians(12, 1);\n  if (fx === \"reverse\") {\n    meridians(9, -1); // reverse turns the other way\n    for (const lat of [-.75, -.4, 0, .4, .75]) { const v = Math.sin(lat), w = Math.cos(lat); g.lineWidth = lw * .8; g.beginPath(); g.moveTo(x + (-w * ct - v * st) * r, y + (-w * st + v * ct) * r); g.lineTo(x + (w * ct - v * st) * r, y + (w * st + v * ct) * r); g.stroke(); }\n  }\n  if (fx === \"pitch\") for (const [lon, lat, sz] of globes.pitch) {\n    const L = lon + ph, cz = Math.cos(lat) * Math.cos(L); if (cz <= 0) continue;\n    const u = Math.cos(lat) * Math.sin(L), v = Math.sin(lat);\n    g.beginPath(); g.arc(x + (u * ct - v * st) * r, y + (u * st + v * ct) * r, Math.max(.4, sz * r * (.4 + .6 * cz)), 0, TAU); g.fill();\n  }\n  if (fx === \"echo\") { // ripples keep leaving the centre\n    const f = (ph * .5) % 1;\n    for (let k = 0; k < 5; k++) { const rr = (k + f) * .23; if (rr > 1.05) continue; g.lineWidth = lw * (1.1 - rr * .6); g.beginPath(); g.arc(x - r * .1, y + r * .06, rr * r, 0, TAU); g.stroke(); }\n    g.beginPath(); g.arc(x - r * .1, y + r * .06, r * .09, 0, TAU); g.fill();\n  }\n  if (fx === \"shimmer\") { // a sphere of ink dust, thicker on the night side\n    for (const [lon, lat, sz] of globes.shimmer) {\n      const L = lon + ph * .5, cz = Math.cos(lat) * Math.cos(L); if (cz <= 0) continue;\n      const u = Math.cos(lat) * Math.sin(L), v = Math.sin(lat);\n      const px = (u * ct - v * st), py = (u * st + v * ct), night = Math.max(0, -(px * lx + py * ly));\n      g.fillStyle = ink(clamp(.4 + .45 * cz + .6 * night, 0, .97));\n      g.beginPath(); g.arc(x + px * r, y + py * r, Math.max(.35, sz * r * (.5 + .5 * cz)), 0, TAU); g.fill();\n    }\n  }\n  if (fx === \"freeze\") { // a moon whose dark half sweeps from left to right and back\n    const phi = Math.PI / 2 + Math.sin(ph * .7) * 1.25, dx = Math.cos(phi), dz = Math.sin(phi);\n    g.lineWidth = lw * .9;\n    g.lineWidth = lw * 1.1;\n    for (let u = -1; u <= 1; u += .07) {\n      const h = Math.sqrt(Math.max(0, 1 - u * u)); let open = false;\n      g.beginPath();\n      for (let k = 0; k <= 14; k++) {\n        const v = -h + 2 * h * k / 14, w = Math.sqrt(Math.max(0, 1 - u * u - v * v)), dark = u * dx + w * dz < 0;\n        if (dark && !open) { g.moveTo(x + u * r, y + v * r); open = true; } else if (dark) g.lineTo(x + u * r, y + v * r); else open = false;\n      }\n      g.stroke();\n    }\n  }\n}\n/* dust peeling off the blur planet, drifting away from the sun like a comet's tail */\nfunction haze(g, x, y, r, lx, ly, ph) {\n  const away = Math.atan2(-ly, -lx);\n  g.strokeStyle = ink(.7); g.lineWidth = .9; g.setLineDash([.9, 2]);\n  g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); g.setLineDash([]);\n  for (let k = 0; k < 64; k++) {\n    const u = (k * .1373 + ph * .11) % 1;\n    const a = away + Math.sin(k * 12.9898) * .6 * (.25 + u);\n    const d = r * (.9 + u * 2.1);\n    g.fillStyle = ink((1 - u) * (1 - u) * .85);\n    g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, (1 - u * .7) * (.45 + (k % 3) * .3) * Math.max(.7, r / 20), 0, TAU); g.fill();\n  }\n}\nfunction shade(g, x, y, r, lx, ly, d, tilt, a) {\n  g.save();\n  g.beginPath(); g.arc(x, y, r + 1, 0, TAU);\n  g.moveTo(x + lx * r * d + r * 1.02, y + ly * r * d); g.arc(x + lx * r * d, y + ly * r * d, r * 1.02, 0, TAU, true);\n  g.clip(\"evenodd\");\n  const ang = Math.atan2(ly, lx) + Math.PI / 2 + tilt, ca = Math.cos(ang), sa = Math.sin(ang);\n  const sp = Math.max(1.3, r / 10);\n  g.strokeStyle = ink(a); g.lineWidth = Math.max(.5, r / 26);\n  for (let k = -r * 1.3; k <= r * 1.3; k += sp) { const bx = x + sa * k, by = y - ca * k; g.beginPath(); g.moveTo(bx - ca * r * 1.4, by - sa * r * 1.4); g.lineTo(bx + ca * r * 1.4, by + sa * r * 1.4); g.stroke(); }\n  g.restore();\n}\nfunction drawPlanet(g, x, y, r, fx, alpha = 1, ph = 0, turning = false) {\n  if (r < .4 || alpha <= .01) return;\n  const light = Math.atan2(CY - y, CX - x), sx = Math.cos(light), sy = Math.sin(light);\n  // drawn in light on black, so the night side is where strokes fade and the lit side gets the hatching\n  const lx = -sx, ly = -sy;\n  // closer to the sun, more of the planet is lit\n  const near = clamp(1 - (Math.hypot(CX - x, CY - y) - SUN) / 420, 0, 1);\n  g.save(); g.globalAlpha = alpha;\n  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = PAPER; g.fill();\n  g.save(); g.clip();\n  g.strokeStyle = ink(.9); g.fillStyle = ink(.9); g.lineCap = \"round\";\n  const dust = turning && fx === \" t:rgba(18,18,18,0.68);\n  --ink-faint:rgba(18,18,18,0.21);\n  --display:\"Outfit\",\"Avenir Next\",\"Helvetica Neue\",sans-serif;\n  --caps:\"Outfit\",\"Avenir Next\",\"Helvetica Neue\",sans-serif;\n  --num:\"Spline Sans Mono\",ui-monospace,Menlo,monospace;\n  --ease:cubic-bezier(.16,1,.3,1);\n  color-scheme:light;\n}\nhtml,body{background:var(--desk);color:var(--desk-ink)}\nbody{\n  font-family:var(--display);font-weight:300;\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n  padding-block:48px 80px;\n  -webkit-font-smoothing:antialiased;\n}\n::selection{background:var(--ink);color:var(--paper)}\n.wrap{max-width:940px;margin:0 auto;display:grid;gap:56px}\n\n/* ---------- the plate ---------- */\n.plate{\n  position:relative;\n  background-color:var(--paper);\n  background-image:\n    radial-gradient(ellipse 46% 40% at 50% 38%, rgba(0,0,0,.07), transparent 70%),\n    radial-gradient(ellipse 40% 36% at 100% 100%, rgba(0,0,0,.03), transparent 72%),\n    \n    var(--grain, none);\n  color:var(--ink);\n  border-radius:4px;\n  box-shadow:0 1px 2px rgba(0,0,0,.5),0 34px 70px -26px rgba(0,0,0,.8);\n  overflow:hidden;\n  user-select:none;-webkit-user-select:none;\n}\n.plate.dropping::after{content:\"\";position:absolute;inset:14px;border:1px dashed var(--ink-soft);border-radius:3px;pointer-events:none}\n\n.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 36px 0}\n.mark{font-weight:200;font-size:30px;line-height:1;letter-spacing:.06em;text-transform:lowercase}\n.host{font-family:var(--num);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center}\n.host .live{display:inline-flex;align-items:center;gap:6px}\n.host .live::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:beat .625s var(--ease) infinite}\n@keyframes beat{0%{transform:scale(1.5);opacity:1}60%,100%{transform:scale(1);opacity:.55}}\n.src{display:flex;gap:8px}\n.pill{\n  font:inherit;font-family:var(--caps);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);\n  background:none;border:1px solid var(--ink-faint);border-radius:999px;\n  padding:5px 14px 6px;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n  transition:color .4s var(--ease),border-color .4s var(--ease),background-color .4s var(--ease);\n}\n.pill:hover{color:var(--ink);border-color:var(--ink-soft)}\n.pill.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}\n:is(.pill,.cnt,.act,.knob):focus-visible{outline:1px dashed var(--ink);outline-offset:4px;border-radius:999px}\n\ncanvas#stage{display:block;width:100%;height:auto;aspect-ratio:880/540;touch-action:none}\n\n/* ---------- deck ---------- */\n.deck{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;padding:6px 36px 26px}\n.cap{font-family:var(--caps);font-size:10.5px;font-weight:500;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.14em;line-height:1}\n.shape{display:grid;gap:14px}\n.counts{display:grid;grid-template-columns:auto auto;align-items:center;gap:14px;justify-content:start}\n.counts .cap{padding-bottom:16px}\n.counts .row{display:flex;gap:2px}\n.cnt{\n  background:none;border:0;padding:4px 3px 0;cursor:pointer;display:grid;justify-items:center;gap:6px;\n  font-family:var(--num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;\n  transition:color .4s var(--ease);\n}\n.cnt svg{display:block;transition:transform .6s var(--ease)}\n.cnt:hover svg{transform:rotate(22deg)}\n.cnt[aria-checked=\"true\"]{color:var(--ink)}\n.rule{width:1px;align-self:stretch;background:var(--ink-faint);margin-block:6px 2px}\n\n.layer{display:grid;gap:12px;min-width:0}\n.layer-head{display:flex;align-items:baseline;gap:12px;min-height:26px;flex-wrap:wrap}\n.layer-name{font-size:22px;font-weight:300;line-height:1;letter-spacing:.01em}\n.layer-desc{font-size:13px;font-weight:300;color:var(--ink-soft);line-height:1.2}\n.knobs{display:flex;gap:22px;transition:opacity .22s ease,transform .3s var(--ease),filter .3s ease}\n.knobs.out{opacity:0;transform:translateY(6px);filter:blur(3px)}\n.knobs .k{display:grid;justify-items:center;gap:2px;transition:opacity .5s var(--ease),transform .6s var(--ease)}\n.knobs.in .k{opacity:0;transform:translateY(8px)}\n.knob{display:block;cursor:ns-resize;touch-action:none;border-radius:50%}\n.k .val{font-family:var(--num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;height:14px;line-height:14px;transition:color .3s}\n.k.active .val{color:var(--ink)}\n\n.spacer{flex:1 1 0}\n.actions{display:flex;gap:18px}\n.act{background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;gap:8px;color:var(--ink)}\n.act svg{display:block;overflow:visible}\n.act .cap{transition:color .3s}\n.act:hover .cap{color:var(--ink)}\n.act[disabled]{opacity:.3;cursor:default}\n\n\n.help{\n  margin:0;padding:14px 36px 18px;border-top:1px solid var(--ink-faint);\n  font-size:14px;font-weight:300;color:var(--ink-soft);min-height:20px;line-height:1.45;\n}\n\n/* ---------- notes ---------- */\n.notes{display:grid;gap:20px;max-width:640px}\n.notes h2{margin:0;font-weight:200;font-size:28px;letter-spacing:.01em;color:var(--desk-ink);text-wrap:balance}\n.notes ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}\n.notes li{font-size:17px;line-height:1.5;color:var(--desk-dim);padding-left:22px;position:relative}\n.notes li::before{content:\"\";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;border:1px solid var(--desk-ink)}\n.notes li b{font-weight:400;color:var(--desk-ink)}\n.notes li{font-weight:300}\n.notes .keys{font-family:var(--num);font-size:12px;color:var(--desk-dim);margin:0;line-height:2}\nkbd{font-family:var(--num);font-size:11px;border:1px solid #4a4b43;border-radius:3px;padding:1px 5px;color:var(--desk-ink)}\n\n@media (max-width:720px){\n  .bar,.deck,.help{padding-left:18px;padding-right:18px}\n  .deck{gap:24px}\n  .rule,.spacer{display:none}\n  .knobs{gap:12px}\n}\n\n/* ---------- one plate, two halves ---------- */\nhtml,body{background:transparent}\nbody{padding:0;margin:0;overflow:hidden}\n.wrap{max-width:940px;width:940px;display:block}\n.plate{border-radius:0;box-shadow:none;display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box} /* both plates fill the same frame height, so everything on the seam lines up */\n.bar{height:34px;padding:24px 36px 0;flex-wrap:nowrap;gap:30px;justify-content:flex-end}\n.src[hidden]{display:none}\n.deck{flex-wrap:nowrap;align-items:flex-end;gap:20px;padding:6px 36px 24px;padding-left:172px;min-height:178px;box-sizing:border-box}\n.deck .knobs{gap:16px}\n.actions{gap:12px;align-self:flex-end;padding-bottom:2px}\n.actions canvas{width:52px!important;height:52px!important}\n.deck{flex-direction:row-reverse}\n.help{margin-top:auto;height:58px;box-sizing:border-box;padding:0 36px;padding-left:314px;display:flex;align-items:center;font-size:13.5px}\n\n/* the shared panel: centred on the seam, half of it in each world */\n.seam{position:absolute;left:-150px;bottom:80px;width:300px;display:grid;justify-items:center;gap:12px}\n.seam-head{display:grid;justify-items:center;gap:6px;text-align:center}\n.seam-name{font-size:22px;font-weight:300;line-height:1;letter-spacing:.01em}\n/* the eclipse switches, Gush's on/off mark: beside each sun's name, and beside the open planet's name on the seam */\n.sw{appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;color:inherit;display:block;border-radius:50%;flex:none}\n.sw canvas{display:block;width:100%;height:100%}\n.sw:focus-visible{outline:1px dashed var(--ink);outline-offset:-4px}\n.sun-sw{width:52px;height:52px;margin:-18px -22px -18px 0}\n.seam-title{position:relative;display:block}\n.fx-sw{position:absolute;right:100%;top:50%;width:48px;height:48px;margin:-25px 0 0 0}\n.fx-sw[hidden]{display:none}\n.seam-name.off{color:var(--ink-soft)}\n.f-cap{transition:opacity .5s var(--ease)}\n.f-cap.dark{opacity:.3}\n.seam-desc{font-size:13px;font-weight:300;color:var(--ink-soft);line-height:1.2}\n.seam-row{display:flex;align-items:flex-start;justify-content:center;width:100%}\n.seam-knobs{width:256px;justify-content:center;gap:14px;min-height:108px;align-items:flex-start}\n.seam-hint{margin:0;align-self:center;max-width:200px;font-size:12.5px;line-height:1.55;color:var(--ink-soft);text-align:center;text-wrap:balance}\n\n/* the blend fader: Scan on the left, Rescan on the right, both at full in the middle */\n.master{position:absolute;left:-290px;bottom:0;width:580px;height:58px}\n.master .pill{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;padding:5px 13px 6px}\n.m-roll{left:0}\n.m-undo{right:0}\n.master .pill[disabled]{opacity:.35;cursor:default;pointer-events:none}\n.fader{position:absolute;left:120px;bottom:0;width:340px;height:58px;touch-action:none;cursor:ew-resize;--x:.5;border-radius:2px}\n.fader:focus-visible{outline:1px dashed var(--ink);outline-offset:-6px}\n.f-track{position:absolute;left:70px;width:200px;top:19px;height:20px}\n.f-track::before{content:\"\";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink-faint)}\n.f-track::after{content:\"\";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--ink-soft);transform:translateX(-.5px)}\n.f-knob{position:absolute;top:50%;left:calc(var(--x) * 100%);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--ink);transition:transform .3s var(--ease)}\n.fader:hover .f-knob,.fader.active .f-knob{transform:scale(1.18)}\n.f-cap{position:absolute;top:24px;font-family:var(--caps);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);line-height:1}\n.f-cap.l{right:284px}\n.f-cap.r{left:284px}\n\n/* the preset menu: its name sits on the seam, previous on the black side, next on the white */\n.preset{position:absolute;left:-125px;top:18px;width:250px;height:44px;z-index:4}\n.p-step{position:absolute;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink-faint);background:none;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;padding:0;transition:color .3s var(--ease),border-color .3s var(--ease)}\n.p-step:hover{color:var(--ink);border-color:var(--ink-soft)}\n.p-step svg{display:block}\n#presetPrev{left:0}\n#presetNext{right:0}\n.p-save{right:-38px}\n.preset:focus{outline:none}\n.p-input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}\n.preset.naming .p-label{background-image:linear-gradient(var(--ink),var(--ink))}\n.p-label .ph{opacity:.45;font-style:italic}\n.p-label .caret{display:inline-block;width:1px;height:.95em;margin-left:2px;vertical-align:-.1em;background:var(--ink);animation:caret 1s steps(1) infinite}\n@keyframes caret{50%{opacity:0}}\n.p-name{position:absolute;left:40px;right:40px;top:0;height:44px;background:none;border:0;cursor:pointer;color:var(--ink);font:300 18px/1 var(--display);letter-spacing:.01em;display:grid;place-items:center;padding:0}\n.p-name .p-label{position:relative;padding-bottom:5px;background:linear-gradient(var(--ink-faint),var(--ink-faint)) 0 100%/100% 1px no-repeat;transition:background-size .4s var(--ease)}\n.p-name:hover .p-label,.p-name[aria-expanded=\"true\"] .p-label{background-image:linear-gradient(var(--ink-soft),var(--ink-soft))}\n.preset.dirty .p-label::after{content:\"\";position:absolute;right:-12px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--ink-soft)}\n.p-list{position:absolute;top:50px;left:-25px;width:300px;background:#ededed;border:1px solid rgba(18,18,18,.16);border-radius:3px;padding:8px 0;box-shadow:0 22px 44px -18px rgba(0,0,0,.55);display:grid}\n.p-list[hidden]{display:none}\n.p-row{position:relative;height:34px;border:0;cursor:pointer;font:300 15px/1 var(--display);letter-spacing:.01em;padding:0;color:rgba(18,18,18,.66);background:none;transition:color .2s}\n.p-row.hl{color:#121212;background:rgba(18,18,18,.06)}\n.p-row.cur{color:#121212;font-weight:500}\n.p-row.cur::before{content:\"\";position:absolute;left:22px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:1px solid #121212;background:linear-gradient(90deg,#121212 50%,#ededed 50%)}\n.p-row.save{font-family:var(--caps);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}\n.p-rule{height:1px;background:rgba(18,18,18,.14);margin:6px 24px}\n:root{--hl:rgba(18,18,18,.06)}\nhtml,body{overflow:hidden}\n\n.hide-src #srcDemo,.hide-src #srcFile{display:none}\n.about{position:absolute;top:40px;right:0;width:270px;background:var(--paper);border:1px solid var(--ink-faint);border-radius:3px;padding:18px 20px 16px;\n  box-shadow:0 22px 44px -18px rgba(0,0,0,.35);display:grid;gap:10px;z-index:6;text-align:left;cursor:default}\n.about[hidden]{display:none}\n.a-name{font:300 18px/1.1 var(--display);letter-spacing:.01em;color:var(--ink);margin:0}\n.a-ver{font-family:var(--num);font-size:11px;color:var(--ink-soft);margin-left:6px;letter-spacing:0}\n.a-line{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}\n.a-line a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-faint);text-underline-offset:3px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n\n<main class=\"wrap hide-src\">\n  <section class=\"plate\" id=\"plate\" aria-label=\"Rescan plugin mockup\">\n    <header class=\"bar\">\n      <div class=\"src\" style=\"position:relative\">\n        <button class=\"pill\" id=\"aboutBtn\" type=\"button\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-controls=\"about\" data-help=\"About Scan & Rescan.\">about<\/button>\n        <div class=\"about\" id=\"about\" role=\"dialog\" aria-label=\"About Scan &amp; Rescan\" hidden>\n          <p class=\"a-name\">Scan &amp; Rescan<span class=\"a-ver\">0.9.2<\/span><\/p>\n          <p class=\"a-line\">Two suns by Gush. A free plugin for your DAW, from <a href=\"https://gush.best\" target=\"_blank\" rel=\"noopener\">gush.best<\/a>.<\/p>\n        <\/div>\n        <button class=\"pill on\" id=\"srcDemo\" type=\"button\" data-help=\"A two-bar piano loop in C minor at 96 bpm: four chords broken into eighths, so every slice and every effect is easy to hear.\">piano loop<\/button>\n        <button class=\"pill\" id=\"srcFile\" type=\"button\" data-help=\"Pick any audio file, or drop one on the plate. Both suns play it.\">your audio<\/button>\n        <input type=\"file\" id=\"fileIn\" accept=\"audio/*\" hidden>\n      <\/div>\n      <button class=\"sw sun-sw\" id=\"sunSw\" type=\"button\" role=\"switch\" aria-checked=\"true\" aria-label=\"Rescan on\"><canvas id=\"sunSwCv\" aria-hidden=\"true\"><\/canvas><\/button>\n      <div class=\"mark\">rescan<\/div>\n    <\/header>\n\n    <canvas id=\"stage\" aria-label=\"The sun. Each bundle of rays is a step; a lit step sends its sound into the granulator and its effects. Planets on the left are effect layers.\"><\/canvas>\n\n    <footer class=\"deck\">\n      <div class=\"actions\">\n        <button class=\"act\" id=\"dice\" type=\"button\" aria-label=\"Roll the dice for Rescan\">\n          <canvas id=\"dieCv\" width=\"64\" height=\"64\" style=\"width:64px;height:64px;display:block\" aria-hidden=\"true\"><\/canvas>\n          <span class=\"cap\">dice<\/span>\n        <\/button>\n        <button class=\"act\" id=\"undo\" type=\"button\" disabled aria-label=\"Undo on Rescan\" data-help=\"Undo the last change on Rescan only. Undo last, at the bottom, steps back through everything.\">\n          <canvas id=\"glassCv\" width=\"64\" height=\"64\" style=\"width:64px;height:64px;display:block\" aria-hidden=\"true\"><\/canvas>\n          <span class=\"cap\">undo<\/span>\n        <\/button>\n      <\/div>\n      <div class=\"shape\">\n      <div class=\"counts\" data-help=\"Steps per bar. Few steps plant big, slow clouds; many steps plant a fine rain of small ones.\">\n        <div class=\"row\" role=\"radiogroup\" aria-label=\"Steps per bar\" id=\"counts\"><\/div>\n        <span class=\"cap\">steps<\/span>\n      <\/div>\n      <div class=\"counts\" data-help=\"Pattern length, from a quarter of a bar to two bars. The sun always shows the whole pattern.\">\n        <div class=\"row\" role=\"radiogroup\" aria-label=\"Pattern length\" id=\"bars\"><\/div>\n        <span class=\"cap\">bars<\/span>\n      <\/div>\n      <\/div>\n      <div class=\"rule\" aria-hidden=\"true\"><\/div>\n      <div class=\"layer\">\n        <div class=\"layer-head\"><span class=\"layer-name\" id=\"layerName\">Gate<\/span><span class=\"layer-desc\" id=\"layerDesc\">which steps feed the clouds<\/span><\/div>\n        <div class=\"knobs\" id=\"knobs\"><\/div>\n      <\/div>\n          <\/footer>\n    <p class=\"help\" id=\"help\" aria-live=\"polite\"><\/p>\n    <div class=\"preset\" id=\"preset\" tabindex=\"-1\">\n      <button class=\"p-step\" id=\"presetPrev\" type=\"button\" aria-label=\"Previous preset\" data-help=\"Previous preset.\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M6.5 1.5 3 5l3.5 3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <button class=\"p-name\" id=\"presetName\" type=\"button\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-controls=\"presetList\"><span class=\"p-label\" id=\"presetLabel\">First Light<\/span><\/button>\n      <button class=\"p-step\" id=\"presetNext\" type=\"button\" aria-label=\"Next preset\" data-help=\"Next preset.\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M3.5 1.5 7 5 3.5 8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <button class=\"p-step p-save\" id=\"presetSave\" type=\"button\" aria-label=\"Save as a new preset\" data-help=\"Save as a new preset: name it, press Return.\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6 1.5v6M3.2 5 6 7.8 8.8 5M2 10.5h8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <input class=\"p-input\" id=\"presetInput\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Name for the new preset\" tabindex=\"-1\">\n      <div class=\"p-list\" id=\"presetList\" role=\"listbox\" aria-label=\"Presets\" hidden><\/div>\n    <\/div>\n    <div class=\"seam\" id=\"seam\" aria-label=\"The planets' knobs, shared by both suns\">\n      <div class=\"seam-head\" id=\"fxHead\"><span class=\"seam-title\"><button class=\"sw fx-sw\" id=\"fxSw\" type=\"button\" role=\"switch\" aria-checked=\"true\" hidden><canvas id=\"fxSwCv\" aria-hidden=\"true\"><\/canvas><\/button><span class=\"seam-name\" id=\"fxName\">Planets<\/span><\/span><span class=\"seam-desc\" id=\"fxDesc\">six effects, shared by both suns<\/span><\/div>\n      <div class=\"seam-row\"><div class=\"knobs seam-knobs\" id=\"fxKnobs\"><\/div><\/div>\n    <\/div>\n    <div class=\"master\" id=\"master\">\n    <button class=\"pill m-roll\" id=\"rollBoth\" type=\"button\" data-help=\"Roll both suns at once: new patterns and effects on Scan and Rescan together.\">roll both<\/button>\n    <button class=\"pill m-undo\" id=\"undoLast\" type=\"button\" disabled data-help=\"Undo the last change anywhere: either sun, the planets, a preset. Key Z.\">undo last<\/button>\n    <div class=\"fader\" id=\"fader\" role=\"slider\" tabindex=\"0\" aria-label=\"Blend between Scan and Rescan\" aria-valuemin=\"0\" aria-valuemax=\"100\"\n      data-help=\"Blend. All the way left plays only Scan, all the way right only Rescan; in the middle both play at full. Double-click to centre.\">\n      <span class=\"f-cap l\">scan<\/span><span class=\"f-track\"><span class=\"f-knob\"><\/span><\/span><span class=\"f-cap r\">rescan<\/span>\n    <\/div>\n    <\/div>\n\n  <\/section>\n\n<\/main>\n\n<script>\n(() => {\n\"use strict\";\n/* the outer page owns what the two suns share; on its own this page still plays by itself */\nconst SH = (() => { try { return window.parent !== window && window.parent.SHARED ? window.parent.SHARED : null; } catch (_) { return null; } })();\nconst SIDE = \"rescan\";\nconst performance = SH ? SH.clock : window.performance; // one clock for both halves, so a planet's two halves turn together\n\n/* ================= constants ================= */\nconst W = 880, H = 540;\nconst CX = 440, CY = 270, SUN = 80;\nconst STUB = 18, MAXL = 136, R0 = SUN + 6;\nconst BPM = 96, BAR = 60 / BPM * 4;\nconst COUNTS = [1, 2, 4, 8, 16, 32];\nconst BARS = [.25, .5, 1, 2];\nconst BAR_LABEL = { .25: \"1/4\", .5: \"1/2\", 1: \"1\", 2: \"2\" };\nconst FXN = [\"repeat\", \"reverse\", \"freeze\", \"pitch\", \"echo\", \"shimmer\"];\nconst INK = \"18,18,18\";\nconst PAPER = \"#ededed\", PAPER_LIGHT = \"#e4e4e4\";\nconst ink = a => `rgba(${INK},${a})`;\nconst TAU = Math.PI * 2;\n\nconst FX = {\n  repeat:  { name: \"Repeat\",  desc: \"the step stutters in time\" },\n  reverse: { name: \"Reverse\", desc: \"the step plays backwards, swelling in\" },\n  freeze:  { name: \"Freeze\",  desc: \"the step holds the sound it caught first\" },\n  pitch:   { name: \"Pitch\",   desc: \"the step jumps to a new note in the key\" },\n  echo:    { name: \"Echo\",    desc: \"the step echoes in time, through a filter\" },\n  shimmer: { name: \"Shimmer\", desc: \"the step melts into a rising reverb\" }\n};\n/* the planets zigzag down the seam (0 is this page's inner edge), three on Scan's black, three on\n   Rescan's white, with the single plugin's angle and size ratios. Both pages hold all six: a planet on\n   the far side is simply off this canvas, and anything that crosses the seam is drawn by both halves. */\nconst TRAY = [\n  { fx: \"repeat\",  x: 0 - 36, y: 66,  r: 26 },\n  { fx: \"reverse\", x: 0 + 36, y: 146, r: 20 },\n  { fx: \"freeze\",  x: 0 - 36, y: 228, r: 24 },\n  { fx: \"pitch\",   x: 0 + 36, y: 308, r: 19 },\n  { fx: \"echo\",    x: 0 - 36, y: 388, r: 21 },\n  { fx: \"shimmer\", x: 0 + 36, y: 468, r: 29 }\n];\nconst SEAM_NAME = \"Planets\", SEAM_DESC = \"six effects, shared by both suns\";\nconst SEAM_HINT = \"Open a planet, then paint it onto the steps of either sun.\";\nconst DEFAULT_HELP = \"Touch either sun to play both. Each lit step plants a cloud; drag along a ray to set how much it sends.\";\n\n/* knob definitions: values are 0..1; stepped knobs snap to their options */\nconst KNOBS = {\n  gate: [\n    { key: \"glow\", label: \"glow\", def: .45, fmt: v => `${glowSecs(v).toFixed(1)} s`, help: \"How long each cloud keeps glowing after its step. Short is a rhythmic rain of grains; long is a slow sky.\" },\n    { key: \"size\", label: \"size\", def: .62, fmt: v => `${Math.round(grainSize(v) * 1000)} ms`, help: \"How long each grain is. Short grains sparkle; long grains melt into each other.\" },\n    { key: \"mix\",  label: \"mix\",  def: .7, fmt: v => `${Math.round(v * 100)}%`, help: \"How much of the clouds you hear against the original. At zero only the original is left.\" }\n  ],\n  repeat: [\n    { key: \"repeat.hits\", label: \"hits\", def: .25, steps: [\"2\", \"3\", \"4\", \"6\", \"8\"], help: \"How many times each step stutters. Very short steps get fewer hits, so a roll never turns into a buzz.\" },\n    { key: \"repeat.fall\", label: \"fall\", def: .3, fmt: v => `${Math.round(v * 100)}%`, help: \"How much quieter each repeat gets.\" }\n  ],\n  reverse: [\n    { key: \"reverse.tail\",  label: \"tail\",  def: .4, fmt: v => `\u00d7${(1 + v * 1.5).toFixed(1)}`, help: \"How far the reversed sound reaches past its step.\" },\n    { key: \"reverse.swell\", label: \"swell\", def: .6, fmt: v => `${Math.round(v * 100)}%`, help: \"How slowly the reversed sound rises in.\" }\n  ],\n  freeze: [\n    { key: \"freeze.hold\",  label: \"hold\",  def: .8, fmt: v => `${Math.round(v * 100)}%`, help: \"How loud a frozen step stays. It keeps the sound it caught first and plays it every time it comes round.\" },\n    { key: \"freeze.bloom\", label: \"bloom\", def: .5, fmt: v => `\u00d7${(1 + v * 3).toFixed(1)}`, help: \"Frozen sound grows longer and softer, into a pad.\" }\n  ],\n  pitch: [\n    { key: \"pitch.interval\", label: \"interval\", def: .75, steps: [\"\u2212oct\", \"\u22125th\", \"+5th\", \"+oct\", \"+oct 5th\"], help: \"The jump. Only fifths and octaves, so it always fits the key.\" },\n    { key: \"pitch.glide\",    label: \"glide\",    def: 0, fmt: v => v < .01 ? \"jump\" : `${Math.round(v * 100)}%`, help: \"Glide slides into the new note instead of jumping.\" },\n    { key: \"pitch.scatter\",  label: \"scatter\",  def: .2, fmt: v => `${Math.round(v * 100)}%`, help: \"How often a hit picks another note of the key instead, like a slow melody.\" }\n  ],\n  echo: [\n    { key: \"echo.time\", label: \"time\", def: .25, steps: [\"1/8\", \"3/16\", \"1/4\", \"3/8\", \"1/2\"], help: \"Echo time, locked to the tempo.\" },\n    { key: \"echo.feedback\", label: \"feedback\", def: .5, fmt: v => `${Math.round(v * 100)}%`, help: \"How many times the echo comes back.\" },\n    { key: \"echo.filter\", label: \"filter\", def: .45, fmt: v => fmtHz(echoCut(v)), help: \"The echo's filter. Low is dark and far away; high is bright and close.\" }\n  ],\n  shimmer: [\n    { key: \"shimmer.size\", label: \"size\", def: .6, fmt: v => `${shimmerSecs(v).toFixed(1)} s`, help: \"How long the reverb lasts.\" },\n    { key: \"shimmer.rise\", label: \"rise\", def: .5, fmt: v => `${Math.round(v * 100)}%`, help: \"How much of the reverb rises an octave, the shimmer.\" }\n  ]\n};\n/* knob scales, shared by the readouts and the engines */\nconst glowSecs = v => .3 * Math.pow(16 / .3, v);\nconst grainSize = v => .03 * Math.pow(800 / 30, v);\nconst echoCut = v => 300 * Math.pow(9000 / 300, v);\nconst fmtHz = f => f >= 1000 ? `${(f / 1000).toFixed(1)} kHz` : `${Math.round(f)} Hz`;\nconst shimmerSecs = v => 2 + v * 10;\n\n/* ================= state ================= */\nconst P = { glow: .45, size: .62, mix: .7,\n  bypass: 0, \"repeat.bypass\": 0, \"reverse.bypass\": 0, \"freeze.bypass\": 0, \"pitch.bypass\": 0, \"echo.bypass\": 0, \"shimmer.bypass\": 0,\n  \"repeat.hits\": .25, \"repeat.fall\": .3, \"reverse.tail\": .4, \"reverse.swell\": .6, \"freeze.hold\": .8, \"freeze.bloom\": .5,\n  \"pitch.interval\": .75, \"pitch.glide\": 0, \"pitch.scatter\": .2, \"echo.time\": .25, \"echo.feedback\": .5, \"echo.filter\": .45,\n  \"shimmer.size\": .6, \"shimmer.rise\": .5 };\nlet spb = 16, bars = 1, count = 16, layer = \"gate\"; // steps per bar, pattern length in bars, total steps on the sun\nconst LOOP = () => BAR * bars;\nconst totalSteps = (s, b) => Math.max(1, Math.round(s * b));\nconst key = (s, b) => `${s}|${b}`;\nconst pats = {};\nfunction emptyPat(c) { const fx = {}; FXN.forEach(f => fx[f] = Array(c).fill(false)); return { steps: Array.from({ length: c }, () => ({ on: false, gate: .5 })), fx }; }\nfunction seedPat(c, list, fx) { const p = emptyPat(c); list.forEach(([i, g]) => p.steps[i] = { on: true, gate: g }); Object.entries(fx || {}).forEach(([f, ids]) => ids.forEach(i => p.fx[f][i] = true)); return p; }\npats[\"1|1\"]  = seedPat(1,  [[0, .75]], { shimmer: [0] });\npats[\"2|1\"]  = seedPat(2,  [[0, 1], [1, .5]], { shimmer: [1] });\npats[\"4|1\"]  = seedPat(4,  [[0, 1], [1, .5], [2, .75], [3, .375]], { shimmer: [0, 2], echo: [3] });\npats[\"8|1\"]  = seedPat(8,  [[0, .75], [1, .375], [3, .5], [4, 1], [6, .5], [7, .25]], { freeze: [0], shimmer: [4], echo: [3], pitch: [6] });\npats[\"16|1\"] = seedPat(16, [[0, 1], [2, .5], [3, .25], [6, .75], [8, 1], [10, .5], [11, .25], [13, .5], [14, .75]], { freeze: [0], pitch: [6], echo: [3, 14], shimmer: [8, 13], reverse: [10] });\n// every other shape is made the first time it opens (see shapePattern)\nconst pat = () => pats[key(spb, bars)];\nconst stepName = i => bars > 1 ? `Bar ${Math.floor(i / spb) + 1}, step ${i % spb + 1}` : `Step ${i + 1}`;\n\nconst undoStack = [];\n// with the other sun linked, a side remembers only its own knobs: the planets' knobs are shared and remembered once\nconst gateP = () => Object.fromEntries(Object.entries(P).filter(([k]) => !k.includes(\".\")));\nconst snap = () => JSON.stringify({ pats, P: SH ? gateP() : P, spb, bars });\nfunction pushUndo(scope) { if (SH) return SH.pushUndo(SIDE, scope); undoStack.push(snap()); if (undoStack.length > 80) undoStack.shift(); syncUndo(); }\nfunction popIfSame() { if (SH) return SH.popIfSame(); if (undoStack.length && undoStack[undoStack.length - 1] === snap()) { undoStack.pop(); syncUndo(); } }\n\n/* ================= helpers ================= */\nfunction mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst rnd = mulberry(11);\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst stepAngle = i => -Math.PI / 2 + i * TAU / count;\nconst mtof = m => 440 * Math.pow(2, (m - 69) / 12);\nfunction findDef(key) { for (const l in KNOBS) for (const d of KNOBS[l]) if (d.key === key) return d; return null; }\nconst stepIndex = key => { const d = findDef(key); return Math.round(P[key] * (d.steps.length - 1)); };\nconst helpEl = document.getElementById(\"help\");\nlet helpLock = 0;\nfunction say(t, hold) { if (!hold && performance.now() < helpLock) return; helpEl.textContent = t; if (hold) helpLock = performance.now() + 1800; }\nconst easeOut = t => 1 - Math.pow(1 - t, 3);\n\n/* ================= paper grain ================= */\n(function grain() {\n  const c = document.createElement(\"canvas\"); c.width = c.height = 220;\n  const g = c.getContext(\"2d\"); const img = g.createImageData(220, 220); const r = mulberry(3);\n  for (let p = 0; p < img.data.length; p += 4) {\n    const dark = r() < .5;\n    img.data[p] = img.data[p + 1] = img.data[p + 2] = dark ? 30 : 255;\n    img.data[p + 3] = Math.floor((dark ? .05 : .045) * 255 * r() * 2);\n  }\n  g.putImageData(img, 0, 0);\n  document.getElementById(\"plate\").style.setProperty(\"--grain\", `url(${c.toDataURL()})`);\n})();\n\n/* ================= planet drawing ================= */\nconst hatch = {};\nFXN.forEach((fx, n) => {\n  const r = mulberry(40 + n * 13), lines = [], dots = [];\n  const set = (ang, gap, jit) => { for (let o = -1; o <= 1; o += gap) { const ca = Math.cos(ang), sa = Math.sin(ang), off = o + (r() - .5) * jit; lines.push([-ca * 1.2 - sa * off, -sa * 1.2 + ca * off, ca * 1.2 - sa * off, sa * 1.2 + ca * off, .5 + r() * .5]); } };\n  if (fx === \"repeat\") set(.35, .17, .04);\n  if (fx === \"reverse\") { set(.6, .2, .05); set(-.75, .2, .05); }\n  if (fx === \"pitch\") for (let k = 0; k < 90; k++) { const a = r() * TAU, d = Math.sqrt(r()) * .95; dots.push([Math.cos(a) * d, Math.sin(a) * d, .03 + r() * .045]); }\n  if (fx === \"shimmer\") { set(.25, .1, .03); set(-.9, .11, .03); set(1.4, .13, .03); }\n  if (fx === \"freeze\") for (let o = .06; o <= 1.05; o += .085) lines.push([-o + (r() - .5) * .02, -1.2, -o + (r() - .5) * .02, 1.2, .55 + r() * .45]);\n  hatch[fx] = { lines, dots };\n});\n/* Planets are lit by the sun: the engraving thins out on the side facing it and the night side is hatched.\n   Large planets (the tray) also turn, each in a way that matches its effect. */\nconst globes = {};\nFXN.forEach((fx, n) => { const r = mulberry(70 + n * 7), blur = fx === \"shimmer\"; globes[fx] = Array.from({ length: blur ? 650 : 150 }, () => [r() * TAU, Math.asin(r() * 2 - 1), blur ? .022 + r() * .034 : .035 + r() * .05]); });\nfunction flatSurface(g, x, y, r, fx) {\n  const h = hatch[fx];\n  for (const L of h.lines) { g.lineWidth = L[4] * Math.max(.6, r / 18); g.beginPath(); g.moveTo(x + L[0] * r, y + L[1] * r); g.lineTo(x + L[2] * r, y + L[3] * r); g.stroke(); }\n  for (const d of h.dots) { g.beginPath(); g.arc(x + d[0] * r, y + d[1] * r, Math.max(.45, d[2] * r), 0, TAU); g.fill(); }\n  if (fx === \"echo\") {\n    g.lineWidth = Math.max(.6, r / 22);\n    for (let k = 1; k <= 4; k++) { g.beginPath(); g.arc(x - r * .12, y + r * .08, r * k * .22, 0, TAU); g.stroke(); }\n  }\n}\nfunction turningSurface(g, x, y, r, fx, ph, lx = 1, ly = 0) {\n  const lw = Math.max(.6, r / 15), tilt = .35, ct = Math.cos(tilt), st = Math.sin(tilt);\n  const meridians = (n, dir) => {\n    for (let k = 0; k < n; k++) {\n      const lon = k * TAU / n + ph * dir, c = Math.cos(lon), u = Math.sin(lon);\n      if (c <= 0) continue;\n      g.lineWidth = lw * (.35 + .65 * c);\n      g.beginPath(); g.ellipse(x, y, Math.max(.01, Math.abs(u) * r), r, tilt, -Math.PI / 2, Math.PI / 2, u < 0); g.stroke();\n    }\n  };\n  if (fx === \"repeat\") meridians(12, 1);\n  if (fx === \"reverse\") {\n    meridians(9, -1); // reverse turns the other way\n    for (const lat of [-.75, -.4, 0, .4, .75]) { const v = Math.sin(lat), w = Math.cos(lat); g.lineWidth = lw * .8; g.beginPath(); g.moveTo(x + (-w * ct - v * st) * r, y + (-w * st + v * ct) * r); g.lineTo(x + (w * ct - v * st) * r, y + (w * st + v * ct) * r); g.stroke(); }\n  }\n  if (fx === \"pitch\") for (const [lon, lat, sz] of globes.pitch) {\n    const L = lon + ph, cz = Math.cos(lat) * Math.cos(L); if (cz <= 0) continue;\n    const u = Math.cos(lat) * Math.sin(L), v = Math.sin(lat);\n    g.beginPath(); g.arc(x + (u * ct - v * st) * r, y + (u * st + v * ct) * r, Math.max(.4, sz * r * (.4 + .6 * cz)), 0, TAU); g.fill();\n  }\n  if (fx === \"echo\") { // ripples keep leaving the centre\n    const f = (ph * .5) % 1;\n    for (let k = 0; k < 5; k++) { const rr = (k + f) * .23; if (rr > 1.05) continue; g.lineWidth = lw * (1.1 - rr * .6); g.beginPath(); g.arc(x - r * .1, y + r * .06, rr * r, 0, TAU); g.stroke ne every grain\n    const w = P[\"tape.wobble\"], n = 32, c = new Float32Array(n), f1 = .5 + Math.random(), f2 = 5 + Math.random() * 4, p1 = Math.random() * TAU;\n    for (let k = 0; k < n; k++) { const s = k / (n - 1) * size; c[k] = rate * Math.pow(2, (w * 28 * Math.sin(TAU * f1 * s + p1) + w * 6 * Math.sin(TAU * f2 * s)) / 1200); }\n    src.playbackRate.setValueCurveAtTime(c, t, size);\n  } else src.playbackRate.value = rate;\n  const env = actx.createGain(); env.gain.value = 0;\n  env.gain.setValueCurveAtTime(envCurve(o.gain, o.shape === \"flat\"), t, size);\n  const pn = actx.createStereoPanner(); pn.pan.value = clamp(o.pan, -1, 1);\n  src.connect(env); env.connect(pn);\n  if (!o.sendOnly) pn.connect(o.tape ? tapeIn : grainBus);\n  if (o.echo) { const s = actx.createGain(); s.gain.value = o.echo; pn.connect(s); s.connect(echoIn); }\n  if (o.verb) { const s = actx.createGain(); s.gain.value = o.verb; pn.connect(s); s.connect(verbIn); }\n  src.start(t, off);\n  src.stop(t + size + .02);\n  grainCount++;\n}\n\nconst tbuf = new Float32Array(1024);\nfunction measureLevel(dt) {\n  if (!actx || !playing) { level += (0 - level) * (1 - Math.exp(-dt * 4)); return; }\n  analyser.getFloatTimeDomainData(tbuf);\n  let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];\n  const rms = Math.sqrt(s / tbuf.length);\n  level += (rms - level) * (1 - Math.exp(-dt * 12));\n  if (rms > .03 && Math.random() < rms * 2.2 && sunDots.length < 14) {\n    const a = Math.random() * TAU, d = SUN * (.25 + Math.random() * .5);\n    sunDots.push({ x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d, r: .8 + Math.min(3.2, Math.random() * rms * 14), life: 1 });\n  }\n}\n\n/* ================= your own audio ================= */\nconst fileIn = document.getElementById(\"fileIn\"), bDemo = document.getElementById(\"srcDemo\"), bFile = document.getElementById(\"srcFile\");\nbFile.addEventListener(\"click\", () => fileIn.click());\nbDemo.addEventListener(\"click\", async () => {\n  if (SH const WAKE_EVENTS = ["pointerdown", "pointerup", "touchend", "click", "keydown"];
const wake = () => SHARED.wake();
WAKE_EVENTS.forEach(t => addEventListener(t, wake, true));
document.querySelectorAll("iframe[data-page]").forEach(f => {
  f.addEventListener("load", () => { try { WAKE_EVENTS.forEach(t => f.contentWindow.addEventListener(t, wake, true)); } catch (_) {} });
  f.srcdoc = PAGES[f.dataset.page];
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
/* source switch */
const bKeys = document.getElementById("srcKeys"), bVoice = document.getElementById("srcVoice");
async function pickClip(k) {
  bKeys.setAttribute("aria-pressed", k === "keys"); bVoice.setAttribute("aria-pressed", k === "voice");
  if (k === liveClip) return;
  liveClip = k;
  if (window.__ctxMade) { try { await SHARED.useDemo(); } catch (e) { console.warn(e); } }
}
bKeys.addEventListener("click", () => pickClip("keys"));
bVoice.addEventListener("click", () => pickClip("voice"));

document.getElementById("getBtn").addEventListener("click", e => { if (IN_FRAME) { e.preventDefault(); liveEvt("download"); } });
addEventListener("keydown", e => {
