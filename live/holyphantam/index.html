<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:,">
<title>HOLYphantam live</title>
<style>
:root{--ground:#E4D8C4;--paper:#F1E7D6;--panel:#F7EFE2;--ink:#2E2720;--muted:#8A7C68;--line:#DDCFB9;--copper:#B2622F;--copperSoft:#EED3B8;--steel:#5F574D;--glow:#E0884A;--keyWhite:#FBF4E8;
 --k:.86;--kd:.80;--km:.78;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --disp:Didot,"Bodoni 72",Georgia,"Times New Roman",serif;
 --mono:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ground);overscroll-behavior:none;touch-action:none}
body{font-family:var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none;cursor:default}
#win{position:absolute;left:0;top:0;width:1180px;height:760px;transform-origin:0 0;background:var(--paper);overflow:hidden;visibility:hidden}
.a{position:absolute}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:calc(9.5px*var(--k));line-height:1;white-space:nowrap}
.fl{display:flex;align-items:center}
.line{background:var(--line)}
/* buttons */
.tb{display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;font-size:calc(11.5px*var(--k));color:var(--ink);cursor:pointer;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb.on{background:var(--ink);color:var(--panel);border-color:transparent}
.tb.acc.on{background:var(--copper)}
.tb.pill{border-radius:99px}
.tb.caps{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:calc(9.5px*var(--k))}
.ibtn{display:flex;align-items:center;justify-content:center;border-radius:3px;border:1px solid transparent;color:var(--steel);cursor:pointer;gap:5px;padding:0 3px}
.ibtn:hover{background:var(--panel);border-color:var(--line);color:var(--copper)}
.ibtn:active{background:var(--copperSoft)}
.ibtn.dis{color:var(--line);pointer-events:none}
.ibtn.on{background:var(--copper);color:var(--panel)}
.ibtn .ic{flex:0 0 auto;overflow:visible}
.ibtn span{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:calc(9.5px*var(--k));color:var(--ink)}
.ibtn.on span{color:var(--panel)}
.ic{display:block}
/* knob */
.knob{cursor:ns-resize;touch-action:none}
.knob .v{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);color:var(--ink);white-space:nowrap;line-height:12px}
.knob .l{position:absolute;left:0;right:0;text-align:center;color:var(--muted);white-space:nowrap;line-height:14px}
.knob.accent .l{color:var(--copper);font-weight:700}
.knob svg{position:absolute;overflow:visible}
/* combos */
.combo{background:var(--panel);border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;padding-left:6px;font-size:calc(11.5px*var(--k));cursor:pointer;position:absolute}
.combo:hover{border-color:var(--muted)}
.combo i{position:absolute;right:8px;top:50%;margin-top:-1px;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid var(--muted)}
.menu{position:absolute;z-index:50;background:var(--paper);border:1px solid var(--line);padding:7px;display:grid;grid-auto-flow:column;column-gap:4px;box-shadow:0 6px 22px rgba(46,39,32,.18)}
.menu .col{display:flex;flex-direction:column;min-width:0}
.menu .it{height:24px;display:flex;align-items:center;padding:0 12px 0 22px;border-radius:3px;font-size:calc(12.5px*var(--k));white-space:nowrap;cursor:pointer;position:relative}
.menu.disp .it{height:28px;font-size:calc(16px*var(--kd));font-family:var(--disp)}
.menu .it:hover{background:var(--copperSoft)}
.menu .it.sel{color:var(--copper)}
.menu .it.sel:before{content:"";position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--copper)}
.menu .it.dis{color:var(--muted);pointer-events:none;font-size:calc(11px*var(--k))}
.menu .hd{height:22px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--copper);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:calc(9px*var(--k))}
.menu .hd:after{content:"";flex:1;height:1px;background:var(--line)}
.menu .sep{height:1px;background:var(--line);margin:5px 12px}
/* stage / tabs */
.tab .roll,.tab .ibtn{position:absolute}
.fader{cursor:ns-resize}
.mark{position:absolute;pointer-events:none}
#help{position:absolute;left:20px;top:644px;width:1140px;height:16px;font-size:calc(11px*var(--k));line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#help.h{color:var(--ink)}
.gal{position:absolute;inset:0;background:rgba(46,39,32,.35);z-index:40}
.gal .box{position:absolute;left:20px;top:30px;width:1140px;height:700px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.gal .card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:10px 12px}
.gal .card.cur{border:2px solid var(--copper);padding:9px 11px}
.gal .card:hover{border-color:var(--muted)}
.gal .card.cur:hover{border-color:var(--copper)}
/* page chrome */
#x{position:fixed;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--steel);font-size:22px;line-height:26px;text-align:center;cursor:pointer;display:none;z-index:60;font-family:var(--sans)}
#x:hover{background:var(--panel);color:var(--copper)}
#dl{position:fixed;right:12px;bottom:6px;height:22px;display:flex;align-items:center;padding:0 12px;border-radius:99px;background:var(--copper);color:var(--panel);text-decoration:none;font-size:12px;font-weight:600;z-index:60;white-space:nowrap}
#dl:hover{background:var(--ink)}
#hint{position:fixed;left:14px;bottom:6px;height:22px;display:flex;align-items:center;font-size:11px;color:var(--muted);z-index:60;pointer-events:none;transition:opacity .4s}
#turn{position:fixed;inset:0;background:var(--ground);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#turn .ph{width:64px;height:38px;border:2px solid var(--ink);border-radius:7px;position:relative;animation:rot 2.4s ease-in-out infinite}
#turn .ph:after{content:"";position:absolute;right:4px;top:50%;width:3px;height:10px;margin-top:-5px;background:var(--ink);border-radius:2px}
@keyframes rot{0%,20%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
#turn h1{font-family:var(--disp);font-weight:400;font-size:28px}
#turn p{color:var(--muted);font-size:14px;max-width:280px}
#turn button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 18px;border-radius:99px;font-size:13px;font-family:var(--sans)}
</style>
</head>
<body>
<div id="win"></div>
<button id="x" aria-label="Close" title="Close">&times;</button>
<span id="hint">Tap anywhere to wake the sound</span>
<a id="dl" href="https://gush.best/#holyphantam" target="_blank" rel="noopener">Get the plugin, free</a>
<div id="turn"><div class="ph"></div><h1>Turn your phone sideways</h1><p>HOLYphantam is a wide instrument. It needs the whole screen.</p><button id="small">Play it small</button></div>
<script src="data.js"></script>
<script src="params.js"></script>
<script src="presets_data.js"></script>
<script src="mock.js"></script>
<script src="icons.js"></script>
<script src="marks.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
