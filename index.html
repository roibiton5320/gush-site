<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gush</title>
<meta name="description" content="Gush: audio plugins for Mac. Soon, free.">
<style>
:root{--ground:#151513;--ink:#ecebe4;--dim:#a3a29a;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#151513}}
:root[data-theme="dark"]{--ground:#151513}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink)}
body{display:grid;place-items:center;font:400 17px/1.5 system-ui,-apple-system,"Helvetica Neue",sans-serif;padding:24px;box-sizing:border-box}
main{text-align:center}
h1{margin:0;font-weight:800;font-size:clamp(72px,18vw,160px);line-height:.85;letter-spacing:-.02em}
p{margin:18px 0 0;color:var(--dim)}
a{color:var(--ink);text-underline-offset:3px}
</style>
<main>
  <h1>GUSH</h1>
  <p>Two plugins for Mac. Free, very soon.<br>Until then: <a href="https://instagram.com/roibiton">@roibiton</a></p>
</main>
